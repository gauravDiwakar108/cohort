<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
    <title>Assignment - 1 (Medium)</title>
</head>

<body>
    <header>
        <nav>
            <div class="menu">
                <i class="ri-menu-line"></i>
            </div>
            <div class="logo">
                <img src="./assets/logo.png" alt="">
            </div>
            <div class="dark-mode">
                <i class="ri-sun-line"></i>
            </div>
        </nav>

        <section class="search-filter">
            <div class="search">
                <i class="ri-search-line"></i>
                <input style="background: rgb(233, 250, 255);" type="text" placeholder="Search for a Pokemon...">
            </div>
            <div class="filter-sort">
                <div style="background: rgb(233, 250, 255);" class="filter">
                    <label for="filter-by">Filter by types </label>
                    <select style="background: rgb(233, 250, 255);" name="" id="filter-by">
                        <option value=""></option>
                        <option value="">Grass</option>
                        <option value="">Steel</option>
                        <option value="">Water</option>
                        <option value="">Electric</option>
                        <option value="">Rock</option>
                    </select>
                </div>
                <div class="sort">
                    <i class="ri-sort-desc"></i>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="cards">
            <div class="card">
                <div class="card-upper">
                    <p class="id">#0908</p>
                    <i class="ri-heart-line"></i>
                </div>
                <div class="card-middle">
                    <img src="https://assets.pokestats.gg/pokeapi/orig/pokemon/versions/generation-ix/scarlet-violet/908.webp"
                        alt="">
                </div>
                <div class="card-lower">
                    <h3>Meowscarada</h3>
                    <div class="card-about">
                        <div class="p-type">
                            <i class="ri-leaf-fill"></i>
                            <p>GRASS</p>
                        </div>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-upper">
                    <p class="id">#0624</p>
                    <i class="ri-heart-line"></i>
                </div>
                <div class="card-middle">
                    <img src="https://assets.pokestats.gg/pokeapi/orig/pokemon/versions/generation-viii/sword-shield/shiny/624.webp"
                        alt="">
                </div>
                <div class="card-lower">
                    <h3>Pawniard</h3>
                    <div class="card-about">
                        <div class="p-type">
                            <i class="ri-settings-line"></i>
                            <p>DARK/STEEL</p>
                        </div>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-upper">
                    <p class="id">#0229</p>
                    <i class="ri-heart-line"></i>
                </div>
                <div class="card-middle">
                    <img src="https://assets.pokestats.gg/pokeapi/orig/pokemon/versions/generation-viii/brilliant-diamond-shining-pearl/shiny/229.webp"
                        alt="">
                </div>
                <div class="card-lower">
                    <h3>Houndoom</h3>
                    <div class="card-about">
                        <div class="p-type">
                            <i class="ri-fire-fill"></i>
                            <p>DARK/FIRE</p>
                        </div>
                        <i class="ri-arrow-right-line right-arrow"></i>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-upper">
                    <p class="id">#0686</p>
                    <i class="ri-heart-line"></i>
                </div>
                <div class="card-middle">
                    <img src="https://assets.pokestats.gg/pokeapi/orig/pokemon/versions/generation-viii/sword-shield/shiny/686.webp"
                        alt="">
                </div>
                <div class="card-lower">
                    <h3>Inkay</h3>
                    <div class="card-about">
                        <div class="p-type">
                            <img style="height: 15px;" src="./assets/water.png" alt="">
                            <p>DARK/PSYCHIC</p>
                        </div>
                        <i class="ri-arrow-right-line"></i>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="f_container">
            <div class="f_card">
                <div class="c_left">
                    <div class="img_container explore">
                        <img src="./assets/explore.png" alt="">
                    </div>
                </div>
                <div class="c_right">
                    <h3>Explore</h3>
                    <p>Discover all your favorite Pokemon</p>
                </div>
            </div>
            <span></span>
            <div class="f_card">
                <div class="c_left">
                    <div class="img_container filter">
                        <i style="color: #73B968;" class="ri-leaf-fill"></i>
                    </div>
                </div>
                <div class="c_right">
                    <h3>Filter</h3>
                    <p>Find Pokemon by types and abilities</p>
                </div>
            </div>
            <span></span>
            <div class="f_card">
                <div class="c_left">
                    <div class="img_container collection">
                        <i style="color: #F4B831;" class="ri-star-fill"></i>
                    </div>
                </div>
                <div class="c_right">
                    <h3>Collection</h3>
                    <p>Save and manage your collection</p>
                </div>
            </div>
            <span></span>
            <div class="f_card">
                <div class="c_left">
                    <div class="img_container stats">
                        <i style="color: #AB5EE2;" class="ri-map-pin-range-fill"></i>
                    </div>
                </div>
                <div class="c_right">
                    <h3>Stats</h3>
                    <p>View stats and learn about Pokemon</p>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
